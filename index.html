<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --nevoa: #e6edea;
    --tinta: #13362d;
    --tinta-2: #40594f;
    --linha: #b9c9c3;
    --agua: #8b4a26;
    --esmalte: #fbfcfb;
    --traco: #13362d;
    --alerta: #f1c232;
    --alerta-tinta: #2b2100;
    --critico: #a3261c;
    --critico-tinta: #ffffff;
    --agua-critica: #b3261e;
    --haste: #d6e1dd;
    --agua-baixa: #5f8a45;
    --agua-cheia: #8b5a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --nevoa: #0f2621;
      --tinta: #e6edea;
      --tinta-2: #a9bdb6;
      --linha: #2e4a42;
      --agua: #c47c4e;
      --esmalte: #e6edea;
      --critico: #e8857a;
      --critico-tinta: #2a0b08;
      --agua-critica: #d8453a;
      --haste: #1d3832;
      --agua-baixa: #6f9a52;
      --agua-cheia: #a06a3a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --nevoa: #0f2621;
    --tinta: #e6edea;
    --tinta-2: #a9bdb6;
    --linha: #2e4a42;
    --agua: #c47c4e;
    --esmalte: #e6edea;
    --critico: #e8857a;
    --critico-tinta: #2a0b08;
    --agua-critica: #d8453a;
    --haste: #1d3832;
    --agua-baixa: #6f9a52;
    --agua-cheia: #a06a3a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--nevoa);
    color: var(--tinta);
    font: 400 1.0625rem/1.5 Barlow, system-ui, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
  h1, h2 { font-family: "Barlow Condensed", Barlow, system-ui, sans-serif; font-weight: 600; margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--agua); outline-offset: 3px; }

  .barra-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .acoes-topo { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .selo { padding: 3px 8px; background: var(--alerta); color: var(--alerta-tinta); font-size: .875rem; font-weight: 600; }
  .atalho {
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--tinta);
    background: transparent;
    color: var(--tinta);
    font: 600 .9375rem Barlow, system-ui, sans-serif;
    cursor: pointer;
  }
  .atalho[hidden] { display: none; }
  .compartilhar { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .compartilhar svg { flex: none; }
  .dica-atalho { flex-basis: 100%; margin: 0; color: var(--tinta-2); font-size: .9375rem; }
  .dica-atalho[hidden] { display: none; }
  .idiomas { display: flex; gap: 4px; }
  .bandeira {
    display: inline-flex;
    padding: 4px;
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    line-height: 0;
  }
  .bandeira[aria-pressed="true"] { border-color: var(--tinta); }
  .bandeira svg { display: block; width: 28px; height: 20px; }

  .topo {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 32px;
    align-items: stretch;
  }
  @media (min-width: 720px) {
    .topo { grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; }
    main { padding-top: 24px; }
    .leitura { min-height: 480px; }
  }
  .leitura { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 8px; }
  h1 { font-size: clamp(2.5rem, 8.4vw, 5rem); line-height: 1.02; max-width: 13ch; text-wrap: balance; }
  .medida { margin: 20px 0 0; font-size: 1.25rem; font-weight: 500; }
  .tendencia { margin: 4px 0 0; color: var(--tinta-2); }
  .aviso {
    display: flex;
    gap: 10px;
    margin: 20px 0 0;
    padding: 10px 12px;
    max-width: 52ch;
    background: var(--alerta);
    color: var(--alerta-tinta);
    font-weight: 500;
    line-height: 1.35;
  }
  .aviso svg { flex: none; margin-top: 2px; }
  .aviso[hidden] { display: none; }

  /* A regua: o elemento que da identidade a pagina */
  .regua { min-width: 0; }
  .regua-titulo { margin: 0 0 14px; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }
  .regua-corpo { position: relative; height: 430px; }
  .regua .haste {
    position: absolute;
    top: 0; bottom: 0; left: 76px;
    width: 44px;
    background: var(--haste);
    border: 1px solid var(--linha);
    border-radius: 3px;
    overflow: hidden;
  }
  .regua .agua {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--agua-baixa);
    opacity: .92;
    transform-origin: bottom;
  }
  /* Acima da linha da passarela a agua fica vermelha. */
  .regua .agua.critica { background: var(--agua-critica); }
  .regua .agua.sobe { animation: subir 1.1s cubic-bezier(.2, .7, .2, 1); }
  @keyframes subir { from { transform: scaleY(0); } }
  .regua .traco { position: absolute; right: 0; width: 12px; height: 1px; background: var(--tinta-2); z-index: 1; }
  .regua .traco.maior { width: 100%; height: 1px; background: var(--tinta); opacity: .7; }
  .regua .numero {
    position: absolute;
    left: 4px;
    z-index: 1;
    font-size: .75rem;
    font-weight: 600;
    line-height: 1;
    color: var(--tinta);
  }
  .regua .atual {
    position: absolute;
    right: calc(100% - 70px);
    transform: translateY(50%);
    font: 600 1.25rem/1 "Barlow Condensed", Barlow, sans-serif;
    white-space: nowrap;
  }
  .regua .ref {
    position: absolute;
    left: 120px;
    display: flex;
    align-items: center;
    gap: 6px;
    transform: translateY(50%);
    font-size: .9375rem;
    line-height: 1;
    white-space: nowrap;
  }
  .regua .ref::before { content: ""; width: 12px; height: 1px; background: var(--tinta-2); }
  .regua .ref b { font-weight: 600; }
  .regua .ref span { color: var(--tinta-2); }
  .coluna-regua { min-width: 0; }

  /* Inscricao nas novidades: bloco escuro para se destacar entre as secoes. */
  .inscricao { padding: 28px 24px; background: var(--tinta); color: var(--nevoa); border-radius: 12px; }
  .inscricao h2 { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.05; max-width: 18ch; }
  .inscricao p { margin: 10px 0 0; max-width: 60ch; }
  .botao-inscricao {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding: 14px 22px;
    border-radius: 999px;
    background: #25d366;
    color: #06301a;
    font-weight: 600;
    font-size: 1.0625rem;
    text-decoration: none;
  }
  .botao-inscricao:hover { background: #3be07a; }
  .botao-inscricao:focus-visible { outline-color: var(--nevoa); }
  .inscricao .nota-inscricao { font-size: .875rem; opacity: .8; }

  .guia-ios { position: fixed; inset: 0; z-index: 20; }
  .guia-ios[hidden] { display: none; }
  .guia-fundo { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
  .guia-cartao {
    position: absolute;
    left: 12px; right: 12px; bottom: 96px;
    max-width: 460px;
    margin: 0 auto;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    padding: 20px 18px 16px;
    background: var(--nevoa);
    color: var(--tinta);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .guia-cartao h2 { font-size: 1.6rem; }
  .guia-nota { margin: 6px 0 12px; color: var(--tinta-2); font-size: .9375rem; }
  .guia-passos { margin: 0; padding: 0; list-style: none; counter-reset: passo; }
  .guia-passos li {
    counter-increment: passo;
    display: grid;
    grid-template-columns: 26px auto minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--linha);
    line-height: 1.35;
  }
  .guia-passos li::before {
    content: counter(passo);
    display: grid;
    place-items: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--tinta);
    color: var(--nevoa);
    font-weight: 600;
    font-size: .875rem;
  }
  .guia-icones { display: flex; gap: 4px; }
  .guia-icones svg { display: block; }
  .guia-fechar {
    width: 100%;
    min-height: 44px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--tinta);
    color: var(--nevoa);
    font: 600 1rem Barlow, system-ui, sans-serif;
    cursor: pointer;
  }
  /* A seta aponta para o botao ••• do Safari, no canto de baixo a direita. */
  .guia-seta { position: absolute; right: 22px; bottom: 30px; animation: apontar 1s ease-in-out infinite; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .guia-seta.centro { right: calc(50% - 22px); }
  .guia-seta.topo { top: 8px; bottom: auto; transform: rotate(180deg); animation: none; }
  @keyframes apontar { 50% { transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .guia-seta { animation: none; } }
  /* QR code: fica no fundo branco para a camera conseguir ler em qualquer tema. */
  .qr { display: flex; align-items: center; gap: 14px; margin-top: 20px; color: inherit; text-decoration: none; font-size: .875rem; line-height: 1.35; }
  .qr img { flex: none; padding: 6px; background: #fff; border-radius: 4px; }
  .qr small { display: block; margin-top: 4px; color: var(--tinta-2); overflow-wrap: anywhere; }
  .grafico text.marca { font-size: 11px; fill: var(--tinta-2); opacity: .7; }

  /* Impressao em papel ou PDF: tira os botoes e deixa o QR, a marca e os creditos. */
  @media print {
    .acoes-topo, .idiomas, .dica-atalho, .periodos, .unidade, details, .simulacao, .registrar, .botao { display: none !important; }
    body { background: #fff; color: #000; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    section, .topo { break-inside: avoid; }
    footer a::after { content: " (" attr(href) ")"; }
  }
  .regua-legenda { margin: 14px 0 0; font-size: .875rem; color: var(--tinta-2); max-width: 46ch; }
  @media (prefers-reduced-motion: reduce) { .regua .agua.sobe { animation: none; } }

  section { margin-top: 48px; }
  h2 { font-size: 1.75rem; line-height: 1.1; }
  .apoio-grafico { margin: 4px 0 12px; color: var(--tinta-2); max-width: 70ch; }
  .periodos { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
  .periodo {
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--linha);
    background: transparent;
    color: var(--tinta);
    font: 600 .9375rem Barlow, system-ui, sans-serif;
    cursor: pointer;
  }
  .periodo[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--nevoa); }
  .grafico { position: relative; }
  .grafico svg { display: block; width: 100%; touch-action: pan-y; }
  .grafico text { font: 400 13px Barlow, system-ui, sans-serif; fill: var(--tinta-2); }
  .grafico text.ref { fill: var(--tinta); font-weight: 600; paint-order: stroke; stroke: var(--nevoa); stroke-width: 4px; }
  .dica {
    position: absolute;
    top: 0; left: 0;
    padding: 6px 10px;
    background: var(--tinta);
    color: var(--nevoa);
    font-size: .9375rem;
    line-height: 1.25;
    pointer-events: none;
    white-space: nowrap;
  }
  .dica[hidden] { display: none; }

  .numeros {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 24px;
    margin: 40px 0 0;
    padding: 20px 0 0;
    border-top: 2px solid var(--tinta);
  }
  @media (min-width: 720px) { .numeros { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .numeros dt { color: var(--tinta-2); font-size: .9375rem; }
  .numeros dd { margin: 2px 0 0; font: 600 1.625rem/1.15 "Barlow Condensed", Barlow, sans-serif; }
  .numeros dd small { display: block; font: 400 .875rem/1.3 Barlow, sans-serif; color: var(--tinta-2); margin-top: 2px; }

  details { margin-top: 24px; }
  summary { cursor: pointer; font-weight: 500; padding: 8px 0; }
  .rolagem { max-height: 340px; overflow-y: auto; }
  table { width: 100%; max-width: 420px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  caption { position: absolute; left: -9999px; }
  th, td { text-align: left; padding: 5px 16px 5px 0; border-bottom: 1px solid var(--linha); }
  th:last-child, td:last-child { text-align: right; padding-right: 0; }

  .unidade { display: inline-flex; gap: 16px; margin: 10px 0 0; font-size: .9375rem; color: var(--tinta-2); flex-wrap: wrap; }
  .unidade label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 32px; }
  .unidade input { accent-color: var(--agua); margin: 0; }
  .registrar { align-self: flex-start; margin: 14px 0 0; font-weight: 600; }
  .registrar[hidden] { display: none; }

  .atracoes {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0 40px;
    margin-top: 12px;
    border-top: 2px solid var(--tinta);
  }
  @media (min-width: 720px) { .atracoes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .atracao { padding: 18px 0; border-bottom: 1px solid var(--linha); min-width: 0; }
  .atracao .topo-a { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .atracao h3 { margin: 0; font: 600 1.5rem/1.1 "Barlow Condensed", Barlow, sans-serif; }
  .atracao .sub { display: block; color: var(--tinta-2); font-size: .9375rem; }
  .estado-a { flex: none; padding: 3px 8px; font-size: .875rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--linha); }
  .estado-a.atencao { background: var(--alerta); color: var(--alerta-tinta); border-color: var(--alerta); }
  .estado-a.acima, .estado-a.fechado { background: var(--critico); color: var(--critico-tinta); border-color: var(--critico); }
  .medidor { position: relative; height: 10px; margin: 12px 0 6px; background: var(--linha); }
  .medidor i { position: absolute; inset: 0 auto 0 0; background: var(--agua); }
  .numeros-a { display: flex; justify-content: space-between; gap: 12px; font-size: .9375rem; flex-wrap: wrap; }
  .atracao p { margin: 8px 0 0; }
  .atracao .nota-a { color: var(--tinta-2); font-size: .875rem; }

  .barras { margin-top: 12px; border-top: 2px solid var(--tinta); }
  .barra {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
    width: 100%;
    padding: 12px 8px;
    border: 0;
    border-bottom: 1px solid var(--linha);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
  }
  button.barra { cursor: pointer; }
  button.barra:hover { background: color-mix(in srgb, var(--linha) 45%, transparent); }
  .barra.agora { background: color-mix(in srgb, var(--agua) 14%, transparent); }
  .barra .nome b { display: block; font-weight: 600; }
  .barra .nome span { color: var(--tinta-2); font-size: .875rem; }
  .barra .trilho { position: relative; height: 12px; background: color-mix(in srgb, var(--linha) 55%, transparent); }
  .barra .trilho i { position: absolute; inset: 0 auto 0 0; background: var(--tinta-2); }
  .barra.limite .trilho i { background: var(--critico); }
  .barra.agora .trilho i { background: var(--agua); }
  .barra .valor small { display: block; color: var(--tinta-2); font-size: .875rem; }
  @media (min-width: 720px) {
    .barra { grid-template-columns: minmax(200px, 1.2fr) minmax(0, 2fr) 160px; gap: 16px; align-items: center; }
    .barra .valor { text-align: right; }
  }

  .simulacao {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--tinta);
    color: var(--nevoa);
    font-weight: 500;
  }
  .simulacao[hidden] { display: none; }
  .simulacao button {
    padding: 8px 12px;
    border: 1px solid var(--nevoa);
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .cabeca-relatos { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .filtro { display: inline-flex; gap: 14px; flex-wrap: wrap; color: var(--tinta-2); font-size: .9375rem; }
  .filtro label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 32px; }
  .filtro input { accent-color: var(--agua); margin: 0; }
  .relatos { list-style: none; margin: 12px 0 0; padding: 0; border-top: 2px solid var(--tinta); }
  .relatos li { padding: 12px 0; border-bottom: 1px solid var(--linha); overflow-wrap: anywhere; }
  .relatos b { font-weight: 600; }
  .relatos .meta { display: block; color: var(--tinta-2); font-size: .875rem; }
  .relatos .txt { display: block; }
  .botao {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    background: var(--tinta);
    color: var(--nevoa);
    font-weight: 600;
    text-decoration: none;
  }
  .botao[hidden] { display: none; }

  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--linha); color: var(--tinta-2); font-size: .9375rem; max-width: 72ch; }
  footer p { margin: 0 0 8px; }
  .estado { color: var(--tinta-2); }
</style>
</head>
<body>
<main>
  <div class="barra-topo">
  <div class="acoes-topo">
    <span class="selo" data-i18n="teste.selo">Versão de teste</span>
    <a class="atalho compartilhar" id="compartilhar" href="https://wa.me/" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z" fill="#25d366"/><path d="M8.6 7.4c.3-.3.7-.3.9 0l1.2 1.8c.2.3.1.7-.1.9l-.6.6c.6 1.3 1.6 2.3 2.9 2.9l.6-.6c.3-.2.6-.3.9-.1l1.8 1.2c.3.2.3.6 0 .9l-.8.8c-.6.6-1.5.7-2.3.4-2.4-1-4.3-2.9-5.3-5.3-.3-.8-.2-1.7.4-2.3z" fill="#fff"/></svg>
      <span data-i18n="compartilhar.botao">Compartilhar no WhatsApp</span>
    </a>
    <button type="button" class="atalho" id="atalho" data-i18n="atalho.botao">Criar atalho na tela</button>
  </div>

<script>
(function () {
  const P = window.Painel;
  const t = P.t;
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";
  const INTERVALO_MS = 10 * 60 * 1000;
  const LOCALE = { pt: "pt-BR", en: "en", es: "es", fr: "fr" };
  let dados = null;
  let reguaDesenhada = false;
  let unidade = "m3";
  let simulada = null;
  let relatos = [];
  let filtro = "";
  let erroRelatos = false;
  let horas = 48;
  const CONFIG = window.ReguaConfig || {};

  // A escolha manual fica guardada no aparelho; sem ela, vale o idioma do sistema.
  const guardado = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  // Conta o uso dos botoes no painel do GoatCounter (aba de eventos). Sem o contador carregado, nao faz nada.
  function evento(nome) {
    try {
      if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: nome, title: nome, event: true });
    } catch (e) {}
  }

  function h(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function el(tag, attrs, pai) {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(n);
    return n;
  }

  function aplicarTextos() {
    document.documentElement.lang = LOCALE[P.idioma()];
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((n) => n.setAttribute("aria-label", t(n.dataset.i18nAria)));
    document.querySelectorAll("[data-i18n-alt]").forEach((n) => n.setAttribute("alt", t(n.dataset.i18nAlt)));
    document.querySelectorAll(".bandeira").forEach((b) => {
      const nome = window.ReguaIdiomas[b.dataset.lang]["idioma.nome"];
      b.setAttribute("aria-label", nome);
      b.title = nome;
      b.setAttribute("aria-pressed", String(b.dataset.lang === P.idioma()));
    });
    document.querySelectorAll(".periodo").forEach((b) => {
      b.textContent = P.nomePeriodo(Number(b.dataset.horas));
      b.setAttribute("aria-pressed", String(Number(b.dataset.horas) === horas));
    });
    $("titulo-grafico").textContent = P.tituloPeriodo(horas);
    // A manchete so mostra "Carregando" antes da primeira leitura; depois quem escreve nela e mostrar().
    if (!dados && !erroCarga) $("manchete").textContent = t("carregando");
    $("rodape").textContent = t("rodape.texto", { e: dados ? dados.estacao : "65992502" });
    $("botao-inscricao").href = P.linkInscricao();
    $("compartilhar").href = P.linkWhatsApp(P.textoCompartilhar(dados, location.origin + location.pathname));
  }

  function trocarIdioma(l) {
    P.definirIdioma(l);
    aplicarTextos();
    if (dados) mostrar(dados);
    else if (erroCarga) mostrarErroCarga();
  }

  function desenharRegua(v) {
    const raiz = $("regua");
    raiz.textContent = "";
    raiz.setAttribute("aria-label", t("regua.aria", { v: P.num(v), m: P.num(P.VAZAO_MEDIA) }));
    const max = P.reguaMax(v);
    const pct = (x) => (x / max) * 100;

    raiz.append(h("p", "regua-titulo", t("regua.titulo")));
    const corpo = h("div", "regua-corpo");
    const haste = h("div", "haste");
    const agua = h("div", "agua" + (P.aguaCritica(v) ? " critica" : ""));
    if (!P.aguaCritica(v)) {
      agua.style.background = "color-mix(in oklab, var(--agua-cheia) " + Math.round(P.misturaAgua(v) * 100) + "%, var(--agua-baixa))";
    }
    haste.append(agua);
    for (let x = 1000; x < max; x += 1000) {
      const maior = x % 5000 === 0;
      const tr = h("div", "traco" + (maior ? " maior" : ""));
      tr.style.bottom = pct(x) + "%";
      haste.append(tr);
      if (maior) {
        const n = h("span", "numero", String(x / 1000));
        n.style.bottom = "calc(" + pct(x) + "% + 3px)";
        haste.append(n);
      }
    }
    corpo.append(haste);

    const atual = h("span", "atual", P.num(v) + " ▶");
    atual.style.bottom = pct(v) + "%";
    corpo.append(atual);

    P.marcasRegua().forEach((m) => {
      const r = h("span", "ref");
      r.style.bottom = pct(m.v) + "%";
      r.append(h("b", null, P.num(m.v)), h("span", null, m.nome));
      corpo.append(r);
    });
    raiz.append(corpo, h("p", "regua-legenda", t("regua.legenda")));

    // A agua sobe so na primeira carga; nas atualizacoes seguintes ela ja aparece no nivel.
    agua.style.height = pct(v) + "%";
    if (!reguaDesenhada) agua.classList.add("sobe");
    reguaDesenhada = true;
  }

  function desenharGrafico() {
    const serie = P.recorteSerie(dados.serie, horas);
    const svg = $("grafico-svg");
    const L = $("grafico").clientWidth;
    // Faixa de baixo: datas do eixo e, embaixo delas, a marca d'agua (uma linha, ou duas em tela estreita).
    const linhasMarcaN = L < 560 ? 2 : 1;
    const A = (L < 560 ? 280 : 340) + linhasMarcaN * 14;
    const m = { e: 48, d: 12, t: 12, b: 28 + linhasMarcaN * 14 };
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + L + " " + A);
    svg.setAttribute("height", A);
    $("dica").hidden = true;

    if (serie.length < 2) {
      $("apoio-grafico").textContent = t("graf.poucos");
      return;
    }
    const ts = serie.map((p) => Date.parse(p.t));
    const vs = serie.map((p) => p.v);
    const ini = ts[0], fim = ts[ts.length - 1];
    const cobertura = Math.round((fim - ini) / 3600e3);
    $("apoio-grafico").textContent = t("graf.apoio") + (cobertura < horas - 2 ? " " + t("graf.parcial", { h: cobertura }) : "");

    const topo = P.eixoMax(vs);
    const x = (v) => m.e + ((v - ini) / Math.max(fim - ini, 1)) * (L - m.e - m.d);
    const y = (v) => A - m.b - (v / topo) * (A - m.t - m.b);

    const passo = topo > 16000 ? 4000 : 2000;
    for (let v = 0; v <= topo; v += passo) {
      el("line", { x1: m.e, x2: L - m.d, y1: y(v), y2: y(v), stroke: "var(--linha)", "stroke-width": 1 }, svg);
      el("text", { x: m.e - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = P.num(v);
    }

    // Marcas do eixo do tempo: mais espacadas nos periodos longos e nas telas estreitas.
    let passoH = horas <= 24 ? 6 : horas <= 48 ? 12 : horas <= 168 ? 24 : horas <= 360 ? 72 : 120;
    if (L < 560) passoH *= 2;
    serie.forEach((p, i) => {
      const hBrt = Math.round(ts[i] / 3600e3) - 3;
      if (((hBrt % passoH) + passoH) % passoH !== 0) return;
      const hl = P.horaLocal(p.t);
      el("line", { x1: x(ts[i]), x2: x(ts[i]), y1: A - m.b, y2: A - m.b + 5, stroke: "var(--tinta-2)" }, svg);
      const tx = el("text", { x: x(ts[i]), y: A - m.b + 20, "text-anchor": "middle" }, svg);
      tx.textContent = hl === 0 ? P.dia(p.t) : t("eixo.hora", { h: hl });
    });

    const pontos = serie.map((p, i) => x(ts[i]).toFixed(1) + "," + y(p.v).toFixed(1));
    el("polygon", { points: x(ini) + "," + y(0) + " " + pontos.join(" ") + " " + x(fim) + "," + y(0), fill: "var(--agua)", opacity: .14 }, svg);

    // Media em tinta; limites das atracoes em vermelho. O nome da Garganta fica abaixo da linha, para nao bater no da passarela.
    P.linhasGrafico().forEach((l) => {
      if (l.v > topo) return;
      el("line", { x1: m.e, x2: L - m.d, y1: y(l.v), y2: y(l.v), stroke: l.limite ? "var(--critico)" : "var(--tinta)", "stroke-width": 1.5, "stroke-dasharray": "6 5" }, svg);
      el("text", { class: "ref", x: m.e + 8, y: l.abaixo ? y(l.v) + 16 : y(l.v) - 7 }, svg).textContent = l.rotulo;
    });

    el("polyline", { points: pontos.join(" "), fill: "none", stroke: "var(--agua)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    // Marca d'agua: em telas estreitas vai em duas linhas (nome e endereco; hora da leitura).
    const marca = P.textoMarca(dados, "rovigattidenis-code.github.io/regua-do-iguacu");
    const partes = marca.split(", ");
    const linhasMarca = linhasMarcaN === 2 ? [partes.slice(0, 2).join(", "), partes.slice(2).join(", ")] : [marca];
    linhasMarca.forEach((texto, i) => {
      el("text", { class: "marca", x: L - m.d, y: A - (linhasMarca.length - 1 - i) * 14 - 4, "text-anchor": "end" }, svg).textContent = texto;
    });
    const ult = serie.length - 1;
    el("circle", { cx: x(ts[ult]), cy: y(vs[ult]), r: 5, fill: "var(--agua)", stroke: "var(--nevoa)", "stroke-width": 2 }, svg);

    const guia = el("line", { y1: m.t, y2: A - m.b, stroke: "var(--tinta)", visibility: "hidden" }, svg);
    const ponto = el("circle", { r: 6, fill: "var(--agua)", stroke: "var(--nevoa)", "stroke-width": 2, visibility: "hidden" }, svg);
    const dica = $("dica");
    let atual = ult;

    function mostrarPonto(i) {
      atual = i;
      const px = x(ts[i]), py = y(vs[i]);
      guia.setAttribute("x1", px); guia.setAttribute("x2", px); guia.setAttribute("visibility", "visible");
      ponto.setAttribute("cx", px); ponto.setAttribute("cy", py); ponto.setAttribute("visibility", "visible");
      dica.hidden = false;
      dica.textContent = P.formatarHora(serie[i].t) + ": " + P.formatarVazao(vs[i], unidade);
      const larg = dica.offsetWidth;
      const esquerda = Math.min(Math.max(px - larg / 2, 0), L - larg);
      const acima = py - dica.offsetHeight - 12;
      dica.style.transform = "translate(" + esquerda + "px," + (acima < 0 ? py + 12 : acima) + "px)";
    }
    function esconder() {
      guia.setAttribute("visibility", "hidden");
      ponto.setAttribute("visibility", "hidden");
      dica.hidden = true;
    }
    function maisProximo(cx) {
      const r = svg.getBoundingClientRect();
      const px = ((cx - r.left) / r.width) * L;
      let melhor = 0;
      ts.forEach((v, i) => { if (Math.abs(x(v) - px) < Math.abs(x(ts[melhor]) - px)) melhor = i; });
      return melhor;
    }
    svg.onpointermove = (e) => mostrarPonto(maisProximo(e.clientX));
    svg.onpointerdown = svg.onpointermove;
    svg.onpointerleave = esconder;
    svg.onblur = esconder;
    svg.onkeydown = (e) => {
      if (e.key === "ArrowLeft") { mostrarPonto(Math.max(atual - 1, 0)); e.preventDefault(); }
      else if (e.key === "ArrowRight") { mostrarPonto(Math.min(atual + 1, ult)); e.preventDefault(); }
      else if (e.key === "Escape") esconder();
    };
    svg.setAttribute("aria-label", t("graf.aria", { min: P.num(Math.min(...vs)), max: P.num(Math.max(...vs)), h: horas }));

    const tabela = $("tabela");
    tabela.textContent = "";
    serie.slice().reverse().forEach((p) => {
      const tr = tabela.insertRow();
      tr.insertCell().textContent = P.formatarHora(p.t);
      tr.insertCell().textContent = P.formatarVazao(p.v, unidade);
    });
  }

  function desenharAtracoes() {
    const v = simulada == null ? dados.vazao_m3s : simulada;
    const ritmo = P.ritmo24h(dados);
    const base = simulada == null ? relatos : [];
    const caixa = $("atracoes");
    caixa.textContent = "";
    P.ATRACOES.forEach((a) => {
      const e = P.estadoAtracao(a, v, ritmo, base, Date.now());
      const nomes = P.nomeAtracao(a);
      const art = h("article", "atracao");
      const topo = h("div", "topo-a");
      const nome = h("div");
      nome.append(h("h3", null, nomes.nome), h("span", "sub", nomes.sub));
      const icone = { dentro: "●", atencao: "▲", acima: "■", fechado: "■" }[e.chave];
      topo.append(nome, h("span", "estado-a " + e.chave, icone + " " + e.rotulo));

      const med = h("div", "medidor");
      med.setAttribute("role", "img");
      med.setAttribute("aria-label", t("atr.medidor", { p: Math.round((v / a.limite) * 100) }));
      const fill = h("i");
      fill.style.width = Math.min(100, (v / a.limite) * 100) + "%";
      med.append(fill);

      const margem = a.limite - v;
      const nums = h("div", "numeros-a");
      nums.append(
        h("span", null, t("atr.limite", { v: P.formatarVazao(a.limite, unidade) })),
        h("span", null, t(margem >= 0 ? "atr.margem" : "atr.excesso", { v: P.formatarVazao(Math.abs(margem), unidade) }))
      );
      art.append(topo, med, nums, h("p", null, P.projecao(a, v, ritmo)));
      if (nomes.fora) art.append(h("p", null, nomes.fora));

      let nota = t("atr.fonte", { f: a.fonte.replace(/\.$/, "") });
      if (e.ultimo) {
        nota = t("atr.ultimo", {
          s: P.rotuloSituacao(e.ultimo.situacao),
          ind: e.ultimo.indefinido ? t("semPrevisao") : "",
          quando: P.textoAtraso(P.atrasoMin(e.ultimo.quando, Date.now())),
        }) + " " + nota;
      }
      art.append(h("p", "nota-a", nota));
      caixa.append(art);
    });
  }

  function desenharBarras() {
    const v = simulada == null ? dados.vazao_m3s : simulada;
    const caixa = $("barras");
    caixa.textContent = "";
    const max = Math.max(18000, v) * 1.02;
    const itens = P.REFERENCIAS.map((r) => ({ ...r, ...P.nomeReferencia(r) }));
    if (!itens.some((r) => r.v === simulada)) itens.push({ v, agora: true });
    itens.sort((a, b) => a.v - b.v);

    itens.forEach((r) => {
      const atual = r.agora || r.v === simulada;
      const linha = h(atual ? "div" : "button", "barra" + (atual ? " agora" : r.limite ? " limite" : ""));
      const nome = h("div", "nome");
      nome.append(
        h("b", null, atual && simulada != null ? t("barra.simulacao", { n: r.nome || P.formatarVazao(r.v, unidade) }) : atual ? t("barra.atual") : r.nome),
        h("span", null, atual ? t("barra.piscinas", { v: P.num(P.piscinas(r.v), 1) }) : r.nota)
      );
      const trilho = h("div", "trilho");
      const fill = h("i");
      fill.style.width = Math.max(0.6, (r.v / max) * 100) + "%";
      trilho.append(fill);
      const valor = h("div", "valor", P.formatarVazao(r.v, unidade));
      if (!atual) {
        const razao = v / r.v;
        valor.append(h("small", null, razao >= 2 ? t("barra.vezes", { v: P.num(razao, 1) }) : t("barra.pct", { v: P.num(razao * 100) })));
        linha.type = "button";
        linha.title = t("barra.simular", { v: P.formatarVazao(r.v, unidade) });
        linha.addEventListener("click", () => simular(r.v));
      }
      linha.append(nome, trilho, valor);
      caixa.append(linha);
    });
  }

  function simular(v) {
    simulada = v;
    evento("simulacao");
    desenharSimulacao();
  }

  function desenharSimulacao() {
    $("simulacao").hidden = simulada == null;
    if (simulada != null) {
      $("simulacao-texto").textContent = t("sim.texto", {
        s: P.formatarVazao(simulada, unidade),
        r: P.formatarVazao(dados.vazao_m3s, unidade),
      });
    }
    document.body.style.paddingBottom = simulada == null ? "" : "72px";
    desenharAtracoes();
    desenharBarras();
  }

  function desenharRelatos() {
    const secao = $("ocorrencias");
    secao.hidden = !(CONFIG.FORMULARIO_URL || CONFIG.RELATOS_CSV_URL);
    if (secao.hidden) return;
    if (CONFIG.FORMULARIO_URL) {
      $("botao-registrar").hidden = false;
      $("botao-registrar").href = CONFIG.FORMULARIO_URL;
      $("link-registrar").hidden = false;
    }
    const lista = relatos.filter((r) => !filtro || r.lado === filtro).slice(0, 40);
    const ul = $("relatos");
    ul.textContent = "";
    lista.forEach((r) => {
      const li = h("li");
      const titulo = h("span");
      titulo.append(h("b", null, r.nome + ": "), P.rotuloSituacao(r.situacao) + (r.indefinido ? t("semPrevisao") : ""));
      li.append(titulo);
      if (r.obs) li.append(h("span", "txt", r.obs));
      const meta = [
        r.motivo || null,
        r.vazao != null ? P.formatarVazao(r.vazao, unidade) : null,
        P.formatarHora(r.quando) + " (" + P.textoAtraso(P.atrasoMin(r.quando, Date.now())) + ")",
        r.fonte || null,
      ].filter(Boolean).join(". ");
      li.append(h("span", "meta", meta));
      ul.append(li);
    });
    const vazio = $("relatos-vazio");
    vazio.hidden = lista.length > 0;
    if (!lista.length) vazio.textContent = t(erroRelatos ? "rel.erro" : "rel.vazio");
  }

  async function carregarRelatos() {
    if (!CONFIG.RELATOS_CSV_URL) return;
    try {
      const r = await fetch(CONFIG.RELATOS_CSV_URL, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      relatos = P.lerRelatos(await r.text());
      erroRelatos = false;
      if (dados) desenharAtracoes();
    } catch (e) {
      erroRelatos = !relatos.length;
    }
    desenharRelatos();
  }

  function atualizarAtraso() {
    if (!dados) return;
    const min = P.atrasoMin(dados.medicao, Date.now());
    $("medida").textContent = t("medida", {
      v: P.formatarVazao(dados.vazao_m3s, unidade),
      hora: P.hora(dados.medicao),
      dia: P.dia(dados.medicao),
      atraso: P.textoAtraso(min),
    });
    const texto = P.dadoAtrasado(min)
      ? t("atrasado", { t: P.formatarHora(dados.medicao) })
      : P.alertaPassarela(dados.vazao_m3s, dados.tendencia);
    $("aviso").hidden = !texto;
    $("aviso-texto").textContent = texto || "";
  }

  function mostrar(d) {
    dados = d;
    const v = d.vazao_m3s;
    aplicarTextos();
    $("manchete").textContent = P.manchete(v);
    $("tendencia").textContent = P.fraseTendencia(d);
    desenharRegua(v);
    desenharGrafico();

    $("n-litros").textContent = P.formatarVazao(v, "ml");
    $("n-piscinas").textContent = t("num.piscinasValor", { v: P.num(P.piscinas(v), 1) });
    $("n-taxa").textContent = d.taxa_m3s_por_hora == null ? t("semDado") : t("num.taxa", { v: P.comSinal(d.taxa_m3s_por_hora) });
    if (d.janela_taxa_horas != null) $("n-taxa").appendChild(h("small", null, t("num.janela", { h: P.num(d.janela_taxa_horas) })));
    $("n-cota").textContent = d.cota == null ? t("semDado") : P.num(d.cota, 1) + " cm";
    $("n-qualidade").textContent = P.qualidade(d.qualidade);

    $("estado").textContent = t("rodape.estado", { t: P.formatarHora(d.gerado_em) });
    atualizarAtraso();
    desenharSimulacao();
    desenharRelatos();
  }

  let erroCarga = false;
  function mostrarErroCarga() {
    $("manchete").textContent = t("erro.carregar");
    $("medida").textContent = t("erro.recarregue");
  }

  async function carregar() {
    try {
      const r = await fetch("vazao.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      erroCarga = false;
      mostrar(await r.json());
    } catch (e) {
      if (dados) {
        $("estado").textContent = t("erro.novos", { t: P.formatarHora(dados.gerado_em) });
      } else {
        erroCarga = true;
        mostrarErroCarga();
      }
    }
  }

  let espera;
  new ResizeObserver(() => {
    clearTimeout(espera);
    espera = setTimeout(() => { if (dados) desenharGrafico(); }, 120);
  }).observe($("grafico"));

  document.querySelectorAll(".bandeira").forEach((b) => b.addEventListener("click", () => {
    guardar("regua.idioma", b.dataset.lang);
    evento("idioma-" + b.dataset.lang);
    trocarIdioma(b.dataset.lang);
  }));
  document.querySelectorAll(".periodo").forEach((b) => b.addEventListener("click", () => {
    horas = Number(b.dataset.horas);
    guardar("regua.horas", String(horas));
    evento("grafico-" + horas / 24 + "dias");
    aplicarTextos();
    if (dados) desenharGrafico();
  }));
  $("voltar").addEventListener("click", () => {
    simulada = null;
    desenharSimulacao();
    $("barras").scrollIntoView({ block: "nearest" });
  });
  document.querySelectorAll('input[name="unidade"]').forEach((r) => r.addEventListener("change", () => {
    unidade = r.value;
    if (dados) mostrar(dados);
  }));
  document.querySelectorAll('input[name="filtro"]').forEach((r) => r.addEventListener("change", () => {
    filtro = r.value;
    desenharRelatos();
  }));

  let pedidoInstalacao = null;
  const instalado = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (instalado()) $("atalho").hidden = true;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pedidoInstalacao = e; });
  window.addEventListener("appinstalled", () => {
    evento("atalho-criado");
    $("atalho").hidden = true;
    $("dica-atalho").hidden = false;
    $("dica-atalho").textContent = t("atalho.feito");
  });
  $("compartilhar").addEventListener("click", () => evento("compartilhar-whatsapp"));
  $("botao-inscricao").addEventListener("click", () => evento("inscricao-novidades"));
  $("atalho").addEventListener("click", async () => {
    evento("atalho-clique");
    if (pedidoInstalacao) {
      pedidoInstalacao.prompt();
      await pedidoInstalacao.userChoice;
      pedidoInstalacao = null;
      return;
    }
    if (eIos()) { abrirGuiaIos(); return; }
    $("dica-atalho").hidden = false;
    $("dica-atalho").textContent = t("atalho.outro");
  });

  // iPhone e iPad (o iPad novo se apresenta como Mac, mas tem tela de toque).
  const eIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (/macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  let focoAntes = null;
  function abrirGuiaIos() {
    evento("atalho-guia-iphone");
    // No Safari o botao ••• fica embaixo; no Chrome, Firefox e Edge do iPhone o compartilhar fica na barra de endereco.
    const outroNavegador = /crios|fxios|edgios/i.test(navigator.userAgent);
    $("guia-passo1").textContent = t(outroNavegador ? "guia.passo1outro" : "guia.passo1");
    $("guia-seta").classList.toggle("topo", outroNavegador);
    focoAntes = document.activeElement;
    $("guia-ios").hidden = false;
    document.querySelector(".guia-fechar").focus();
  }
  function fecharGuiaIos() {
    $("guia-ios").hidden = true;
    if (focoAntes) focoAntes.focus();
  }
  document.querySelectorAll("[data-fechar-guia]").forEach((n) => n.addEventListener("click", fecharGuiaIos));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("guia-ios").hidden) fecharGuiaIos(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  const horasGuardadas = Number(guardado("regua.horas"));
  if (P.PERIODOS.includes(horasGuardadas)) horas = horasGuardadas;
  P.definirIdioma(guardado("regua.idioma") || P.detectarIdioma(navigator.languages || [navigator.language]));
  aplicarTextos();
  carregar();
  carregarRelatos();
  setInterval(() => { carregar(); carregarRelatos(); }, INTERVALO_MS);
  setInterval(atualizarAtraso, 60 * 1000);
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo da Regua do Iguacu: a regua do rio na frente das Cataratas. -->
  <defs>
    <clipPath id="borda"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8d3"/>
      <stop offset="1" stop-color="#bfe0ee"/>
    </linearGradient>
    <linearGradient id="queda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ecf3"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#borda)">
    <!-- ceu -->
    <rect width="64" height="64" fill="url(#ceu)"/>
    <!-- mata no alto do paredao -->
    <path d="M-2 18c4-5 8-3 10-5 3-3 7 0 10-2 3-2 6 1 9-1 3-2 7 0 10-2 3-2 6 1 9-1 3-2 6 1 9-1 3-1 6 1 11 2v14H-2z" fill="#1f5a3a"/>
    <path d="M-2 21c5-2 9 0 14-1 6-1 10 1 16 0 6-1 11 1 17 0 6-1 11 1 21 0v6H-2z" fill="#2e7d4f"/>
    <!-- paredao de rocha -->
    <rect x="-2" y="25" width="68" height="29" fill="#5a4636"/>
    <path d="M-2 25h68v2H-2z" fill="#3d2f24"/>
    <!-- quedas d'agua: cortinas brancas descendo o paredao -->
    <g fill="#ffffff">
      <path d="M-2 25h9q1 0 1.5 2l1.5 27H-2z"/>
      <path d="M12 25h8q1 0 1.2 2l.8 27h-11z"/>
      <path d="M43 25h8q1 0 .8 2l-.8 27H42z"/>
      <path d="M55 25h11v29H54z"/>
    </g>
    <g stroke="#a8d2e6" stroke-width="1.2" stroke-linecap="round">
      <path d="M2 29v22M6 31v20M15 29v22M19 32v19M46 29v22M50 32v19M58 29v22M62 31v20"/>
    </g>
    <!-- nevoa e rio -->
    <rect y="53" width="64" height="11" fill="#2f6f8f"/>
    <g fill="#eef7fa">
      <ellipse cx="32" cy="53" rx="40" ry="4.5"/>
      <circle cx="6" cy="49" r="5"/><circle cx="17" cy="50" r="4.5"/>
      <circle cx="47" cy="50" r="4.5"/><circle cx="58" cy="49" r="5"/>
    </g>
    <!-- regua -->
    <rect x="22" y="7" width="20" height="50" rx="1.5" fill="#13362d"/>
    <rect x="24" y="9" width="16" height="46" fill="#fbfcfb"/>
    <rect x="24" y="30" width="16" height="25" fill="#c47c4e"/>
    <g fill="#13362d">
      <rect x="24" y="14" width="8" height="2"/>
      <rect x="24" y="20" width="12" height="2"/>
      <rect x="24" y="26" width="8" height="2"/>
    </g>
    <g fill="#fbfcfb" opacity=".6">
      <rect x="24" y="36" width="8" height="2"/>
      <rect x="24" y="42" width="12" height="2"/>
    </g>
    <!-- tracejado da media -->
    <g fill="#f1c232">
      <rect x="26" y="48" width="3" height="2.5"/>
      <rect x="30.5" y="48" width="3" height="2.5"/>
      <rect x="35" y="48" width="3" height="2.5"/>
    </g>
  </g>
</svg>
